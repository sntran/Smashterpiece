name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run the unit tests
        run: npm test

  deploy:
    # Deploy only after the tests pass, and only from the main branch.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Copy the game files to the site folder
        # Copy only the files that the browser uses. Do not copy the tests
        # or the workflow files.
        run: |
          mkdir _site
          cp index.html style.css manifest.webmanifest sw.js _site/
          cp -r src icons _site/
      - name: Write the version into the service worker
        # Each deploy gets a new version. Then each device gets all the new
        # files together (see sw.js).
        run: |
          version="${GITHUB_SHA::12}"
          sed -i "s/^const VERSION = 'dev';$/const VERSION = '${version}';/" _site/sw.js
          grep -q "const VERSION = '${version}';" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
