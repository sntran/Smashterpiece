<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smash">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="theme-color" content="#6ec8ff">
  <title>Smashterpiece</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view" role="img" aria-label="Smashterpiece"></canvas>
  <div id="announce" class="sr-only" aria-live="polite"></div>
  <div id="announce-now" class="sr-only" aria-live="assertive"></div>
  <div id="aim-cursor" hidden aria-hidden="true"></div>
  <div id="fps" hidden aria-hidden="true"></div>
  <canvas id="confetti"></canvas>

  <div id="loading" class="screen show">
    <div class="logo">Smashterpiece</div>
    <div class="spinner"></div>
  </div>

  <div id="menu" class="screen">
    <div class="logo bounce">Smashterpiece</div>
    <div class="tiles">
      <button class="tile green" data-action="continue" data-label="Continue" aria-label="Continue"></button>
      <button class="tile orange" data-action="free" data-label="Carve" aria-label="Carve"></button>
      <button class="tile cyan" data-action="challenge" data-label="Shapes" aria-label="Shapes"></button>
      <button class="tile purple" data-action="museum" data-label="Museum" aria-label="Museum"></button>
      <button class="tile yellow" data-action="treasures" data-label="Treasures" aria-label="Treasures">
        <span class="badge" id="treasure-badge"></span>
      </button>
    </div>
    <button class="round small corner-bl" data-action="parents" aria-label="Settings"></button>
    <button class="round small corner-br" data-action="sound" aria-label="Sound"></button>
  </div>

  <div id="shapes" class="screen picker">
    <button class="round corner-tl" data-action="back" aria-label="Back"></button>
    <div class="tiles" id="shape-tiles"></div>
  </div>

  <div id="letters" class="screen picker">
    <button class="round corner-tl" data-action="back" aria-label="Back"></button>
    <div class="tiles" id="letter-tiles"></div>
  </div>

  <div id="stones" class="screen">
    <button class="round corner-tl" data-action="back" aria-label="Back"></button>
    <div class="tiles" id="stone-tiles"></div>
  </div>

  <div id="treasures" class="screen">
    <button class="round corner-tl" data-action="back" aria-label="Back"></button>
    <div class="book">
      <div class="book-head"><span class="book-icon" data-icon="chest"></span><span id="treasure-count"></span></div>
      <div class="book-grid" id="treasure-grid"></div>
      <div class="book-head"><span class="book-badge" aria-hidden="true">🏅</span><span id="badge-count"></span></div>
      <div class="book-grid" id="badge-grid"></div>
    </div>
  </div>

  <div id="play" class="screen hud">
    <button class="round corner-tl" data-action="home" aria-label="Home"></button>
    <div class="top-center" id="meter">
      <div class="stars" id="meter-stars"></div>
      <button class="round small" data-action="ghost" aria-label="Ghost shape"></button>
      <button class="round gold pulse" data-action="finish" aria-label="Finish"></button>
    </div>
    <div class="side-right">
      <button class="round" data-action="undo" aria-label="Undo"></button>
      <button class="round" data-action="save" aria-label="Save to the Museum"></button>
      <button class="round" data-action="new" aria-label="New stone"></button>
    </div>
    <div class="easy-pad" id="easy-pad" hidden role="group" aria-label="Easy controls">
      <div class="pad-grid">
        <button class="pad" data-pad="turn-left" aria-label="Turn left">↺</button>
        <button class="pad" data-pad="up" aria-label="Aim up">▲</button>
        <button class="pad" data-pad="turn-right" aria-label="Turn right">↻</button>
        <button class="pad" data-pad="left" aria-label="Aim left">◀</button>
        <button class="pad hit" data-pad="hit" aria-label="Hit"></button>
        <button class="pad" data-pad="right" aria-label="Aim right">▶</button>
        <button class="pad" data-pad="zoom-out" aria-label="Zoom out">−</button>
        <button class="pad" data-pad="down" aria-label="Aim down">▼</button>
        <button class="pad" data-pad="zoom-in" aria-label="Zoom in">+</button>
      </div>
      <div class="pad-row">
        <button class="pad" data-pad="tilt-up" aria-label="Look from higher">⤒</button>
        <button class="pad" data-pad="tilt-down" aria-label="Look from lower">⤓</button>
      </div>
    </div>
    <div class="tool-dock">
      <div class="tool-options" id="tool-options" hidden></div>
      <div class="toolbar" role="toolbar" aria-label="Tools">
        <button class="tool" data-tool="hammer" aria-label="Hammer"></button>
        <button class="tool" data-tool="chisel" aria-label="Point chisel"></button>
        <button class="tool" data-tool="file" aria-label="File"></button>
        <button class="tool" data-tool="clay" aria-label="Clay"></button>
        <button class="tool" data-tool="brush" aria-label="Paint brush"></button>
        <button class="tool" data-tool="sticker" aria-label="Stickers"></button>
      </div>
    </div>
  </div>

  <div id="museum" class="screen hud">
    <button class="round corner-tl" data-action="home" aria-label="Home"></button>
    <div class="empty" id="museum-empty">
      <div class="big-icon" data-icon="museum"></div>
      <button class="tile orange" data-action="free" data-label="Carve" aria-label="Carve"></button>
    </div>
    <div class="museum-bar" id="museum-bar">
      <button class="round" data-action="prev" aria-label="Previous statue"></button>
      <button class="round green" data-action="share" aria-label="Share statue"></button>
      <button class="round red" data-action="delete" aria-label="Delete statue"></button>
      <button class="round" data-action="next" aria-label="Next statue"></button>
    </div>
    <div class="shared-bar" id="shared-bar">
      <button class="tile green" data-action="add-shared" data-label="Add to my Museum" aria-label="Add to my Museum"></button>
    </div>
  </div>

  <div id="celebrate" class="overlay" role="dialog" aria-modal="true" aria-label="You made a Smashterpiece!">
    <div class="card">
      <div class="headline">You made a Smashterpiece!</div>
      <div class="stars big" id="result-stars"></div>
      <div class="row">
        <button class="round" data-action="save" aria-label="Save to the Museum"></button>
        <button class="round" data-action="keep" aria-label="Carve more"></button>
        <button class="round" data-action="home" aria-label="Home"></button>
      </div>
    </div>
  </div>

  <div id="confirm" class="overlay" role="alertdialog" aria-modal="true" aria-label="Are you sure?">
    <div class="card">
      <div class="big-icon" id="confirm-icon"></div>
      <div class="row">
        <button class="round green" data-action="yes" aria-label="Yes"></button>
        <button class="round red" data-action="no" aria-label="No"></button>
      </div>
    </div>
  </div>

  <div id="backup" class="overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="card backup-card settings-card">
      <button class="round small close" data-action="close" aria-label="Close"></button>
      <h2 class="backup-title" id="settings-title">Settings</h2>
      <div class="toggles" id="setting-toggles"></div>
      <h2 class="backup-title">Save file</h2>
      <p class="backup-text">Keep the statues, the treasures and the game in a file. Load the file on this device or on a different device. Nothing on the device is removed.</p>
      <div class="row">
        <button class="tile green" data-action="export" data-label="Save" aria-label="Save to a file"></button>
        <button class="tile cyan" data-action="import" data-label="Load" aria-label="Load a file"></button>
      </div>
      <p class="backup-text" id="backup-result" aria-live="polite"></p>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
  </div>

  <div id="share" class="overlay" role="dialog" aria-modal="true" aria-label="Share statue">
    <div class="card backup-card">
      <button class="round small close" data-action="close-share" aria-label="Close"></button>
      <h2 class="backup-title">Share statue</h2>
      <canvas id="share-qr" aria-label="QR code of the link"></canvas>
      <p class="backup-text" id="share-text"></p>
      <div class="row">
        <button class="tile green" data-action="send-link" data-label="Send" aria-label="Send the link"></button>
        <button class="tile cyan" data-action="copy-link" data-label="Copy link" aria-label="Copy the link"></button>
      </div>
      <p class="backup-text" id="share-result" aria-live="polite"></p>
    </div>
  </div>

  <div id="flash" class="flash"></div>

  <div id="found" class="found" aria-live="polite">
    <div class="rays"></div>
    <div class="found-emoji"></div>
    <div class="found-name"></div>
    <div class="new-badge">NEW!</div>
  </div>

  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="./src/game/main.js"></script>
</body>
</html>
